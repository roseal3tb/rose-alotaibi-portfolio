name: Vercel Build Preflight

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  vercel-build:
    name: Verify Vercel output and production dependency health
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Audit production dependencies
        continue-on-error: true
        run: bun audit --prod --audit-level=high
      - name: Build with Vercel Nitro preset
        env:
          VERCEL: "1"
          NITRO_PRESET: "vercel"
        run: bun run build
      - name: Verify Vercel Build Output
        run: |
          echo "Build output paths:"
          find .vercel .output -maxdepth 3 -type f 2>/dev/null | head -60 || true
          if [ -f .vercel/output/config.json ]; then
            echo "Vercel Build Output API manifest: OK"
          else
            echo "::error::Vercel output manifest missing; check Nitro preset"
            exit 1
          fi
